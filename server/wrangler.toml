name = "tokencount-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Create the database with `npx wrangler d1 create tokencount` and paste its id here.
[[d1_databases]]
binding = "DB"
database_name = "tokencount"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets (not in this file):
#   npx wrangler secret put CONTRIBUTOR_SALT   # long random string; keyed hash for contributor IDs
#   npx wrangler secret put ADMIN_TOKEN        # bearer token for /v1/admin/*
# For `wrangler dev`, put both in server/.dev.vars (git-ignored).
