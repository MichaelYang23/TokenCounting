name: dataset-snapshot

# Publishes the shared dataset as release assets:
#   data-latest       refreshed every night
#   data-YYYY-MM-01   a permanent monthly snapshot, for citing a fixed version
# Does nothing until the repository variable TOKENCOUNT_API_URL is set
# (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ vars.TOKENCOUNT_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Download published records
        run: uv run --no-project --python 3.13 python scripts/snapshot.py --api "${{ vars.TOKENCOUNT_API_URL }}" --out dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            if gh release view "$1" >/dev/null 2>&1; then
              gh release upload "$1" dist/tokencount-records.jsonl.gz dist/summary.json --clobber
              gh release edit "$1" --notes-file dist/NOTES.md
            else
              gh release create "$1" dist/tokencount-records.jsonl.gz dist/summary.json \
                --title "$2" --notes-file dist/NOTES.md --latest=false
            fi
          }
          publish data-latest "Dataset snapshot (latest)"
          if [ "$(date -u +%d)" = "01" ]; then
            publish "data-$(date -u +%F)" "Dataset snapshot $(date -u +%F)"
          fi
