name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate contributed records
        run: |
          shopt -s nullglob
          files=(data/records/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "No records yet."; exit 0; fi
          python -m tokencount validate "${files[@]}"
