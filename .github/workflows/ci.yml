name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest Python we support. Current runner images no longer
        # carry it, so uv provides every interpreter.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --no-project --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - name: Validate contributed records
        run: |
          shopt -s nullglob
          files=(data/records/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "No records yet."; exit 0; fi
          uv run --no-project --python ${{ matrix.python-version }} python -m tokencount validate "${files[@]}"
