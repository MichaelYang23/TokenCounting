name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest Python we support. Current runner images no longer
        # carry it, so uv provides every interpreter.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --no-project --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - name: Validate contributed records
        run: |
          shopt -s nullglob
          files=(data/records/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "No records yet."; exit 0; fi
          uv run --no-project --python ${{ matrix.python-version }} python -m tokencount validate "${files[@]}"

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the Worker (no deploy)
        run: npm run build
